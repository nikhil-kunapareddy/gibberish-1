# Full SFT run. Same code, bigger numbers.
name: sft-full
data_dir: data/full
out_dir: runs/sft-full
init_from: runs/pretrain-full/ckpt_best.pt

max_steps: 2000
batch_size: 16
max_seq_len: 512
grad_accum_steps: 1

lr: 0.0003
min_lr_ratio: 0.1
warmup_steps: 100
weight_decay: 0.0
grad_clip: 1.0

eval_interval: 200
eval_iters: 40
log_interval: 20
ckpt_interval: 500
keep_last_k: 2

device: auto
amp: auto
compile: false
seed: 1337
resume: ""
wandb: false

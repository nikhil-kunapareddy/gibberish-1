# Full data: every story in TinyStories-train.txt (~2.1M stories, 1.9GB download,
# ~500M tokens). Preparation is ~20-40 min single-machine, mostly tokenisation.
name: full
data_dir: data
out_dir: data/full
dataset: roneneldan/TinyStories
instruct_dataset: roneneldan/TinyStories-Instruct
source_file: TinyStories-train.txt
instruct_source_file: TinyStories-Instruct-train.txt
max_download_bytes: null          # null = whole file
num_stories: null                 # null = every story
num_instruct_examples: null
tokenizer_train_stories: 200000   # BPE converges long before 2M stories
vocab_size: 8192
val_fraction: 0.005
split_seed: 1234
